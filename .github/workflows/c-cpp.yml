name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Make (GCC)
      run: make CC=gcc

    - name: Clean before Clang
      run: make clean

    - name: Make (Clang)
      run: make CC=clang
