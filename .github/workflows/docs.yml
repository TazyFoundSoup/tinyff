name: Documentation

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libxml2-dev libxslt1-dev cmake libyaml-dev libclang-dev llvm-dev libglib2.0-dev libjson-glib-dev flex nodejs npm

      - name: Install Hotdoc
        run: pipx install hotdoc

      - name: Build documentation
        working-directory: documentation
        run: hotdoc run

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: documentation/built_doc/html

      - name: Deploy
        uses: actions/deploy-pages@v4
